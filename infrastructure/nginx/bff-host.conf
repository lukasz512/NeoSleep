# NeoSleep BFF — host nginx reverse proxy (Hetzner VPS, PM2 processes, no Docker)
# Copy to /etc/nginx/sites-available/bff and symlink into sites-enabled.
# PROD: api.neosleepcare.com  -> 127.0.0.1:3000 (pm2 process "bff-prod")
# UAT:  api-uat.neosleepcare.com -> 127.0.0.1:3001 (pm2 process "bff-uat")
#
# apps/pwa and apps/web still deploy to GoDaddy via FTP — this file only
# fronts the BFF. Static SPA hosting moves here in a separate migration.

server {
    listen 80;
    server_name api.neosleepcare.com api-uat.neosleepcare.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.neosleepcare.com;

    ssl_certificate     /etc/letsencrypt/live/api.neosleepcare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.neosleepcare.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options          "DENY"                              always;
    add_header X-Content-Type-Options   "nosniff"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_pass_header  Set-Cookie;
    }
}

server {
    listen 443 ssl http2;
    server_name api-uat.neosleepcare.com;

    ssl_certificate     /etc/letsencrypt/live/api-uat.neosleepcare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-uat.neosleepcare.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options          "DENY"                              always;
    add_header X-Content-Type-Options   "nosniff"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_pass_header  Set-Cookie;
    }
}
