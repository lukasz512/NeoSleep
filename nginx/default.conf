# NeoSleep — Nginx reverse proxy + SPA server
# Production: app.neosleepcare.com → api-prod:3000
# UAT: app-uat.neosleepcare.com → api-uat:3001

server {
    listen 80;
    server_name app.neosleepcare.com app-uat.neosleepcare.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.neosleepcare.com;

    ssl_certificate     /etc/nginx/ssl/app.neosleepcare.com.crt;
    ssl_certificate_key /etc/nginx/ssl/app.neosleepcare.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html/app-prod;
    index index.html;

    add_header X-Frame-Options          "DENY"                              always;
    add_header X-Content-Type-Options   "nosniff"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|auth|health)(/|$) {
        proxy_pass         http://api-prod:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_pass_header  Set-Cookie;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl http2;
    server_name app-uat.neosleepcare.com;

    ssl_certificate     /etc/nginx/ssl/app-uat.neosleepcare.com.crt;
    ssl_certificate_key /etc/nginx/ssl/app-uat.neosleepcare.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /usr/share/nginx/html/app-uat;
    index index.html;

    add_header X-Frame-Options          "DENY"                              always;
    add_header X-Content-Type-Options   "nosniff"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|auth|health)(/|$) {
        proxy_pass         http://api-uat:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_pass_header  Set-Cookie;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }
}
