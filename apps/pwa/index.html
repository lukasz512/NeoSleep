<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>NeoSleep PWA</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- NEO-131: title bar / status bar color from the very first frame, one
         per OS theme — the app bar's desk color (theme.scss --pwa-desk with
         the default brand teal). Once the app runs, useThemeColorMeta takes
         both tags over, so an explicit in-app theme or a tenant's own color
         wins. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e0e9e8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1a18" />
    <meta name="apple-mobile-web-app-title" content="NeoSleep" />
    <!-- NEO-87: Chrome fires beforeinstallprompt once per page load, and on a
         repeat visit (service worker already active) it can fire before the
         app bundle has run. Catch it here, first thing; main.ts picks it up
         (composables/useInstallPrompt.ts). -->
    <script>
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__neoInstallPrompt = e;
      });
    </script>
    <!-- NEO-123: on the patient's QR page (/q#<token>), tell the API "opened"
         the moment this HTML arrives, ~1.5 s before the app bundle could, so
         the doctor's QR dialog closes sooner. text/plain = no CORS preflight.
         %VITE_API_URL% is filled in at build time; left as-is (dev) = same
         origin via the Vite proxy. Best effort: the form's own lookup marks
         the link opened too. -->
    <script>
      (function () {
        var token = location.pathname === "/q" ? location.hash.slice(1) : "";
        if (!/^[A-Za-z0-9_-]{43}$/.test(token)) return;
        var api = "%VITE_API_URL%";
        if (api.charAt(0) === "%") api = "";
        try {
          fetch(api + "/api/v1/public/questionnaire/opened", {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: token,
            credentials: "omit",
            keepalive: true,
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>
    <!-- Cascade-layer order (Vuetify 4). Must be declared before any CSS
         loads: Vuetify's component styles are imported per component and can
         otherwise reach the page before vuetify/styles, which would put the
         reset/core layer above the component layer. `app-base` holds the
         app's own link defaults (assets/theme.scss): above Vuetify's reset,
         below its components. -->
    <style>@layer vuetify-core, app-base, vuetify-components, vuetify-overrides, vuetify-utilities, vuetify-final;</style>
    <!-- Optional: add a font link here and set --pwa-font-sans in theme.scss to use it (see DESIGN_AND_UI.md). -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
