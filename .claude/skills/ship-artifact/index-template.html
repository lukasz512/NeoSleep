<title>NeoSleep Change Index</title>
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f8f8; --surface:#ffffff; --ink:#15201f; --muted:#5a6968; --line:#d9e2e1;
  --accent:#0f6f6a; --accent-soft:#e2f1ef; --ok:#1d7a3e; --ok-soft:#e5f4ea; --warn:#8a5a00; --warn-soft:#fff3d6;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0f1515; --surface:#172020; --ink:#e3ecea; --muted:#94a5a3; --line:#2a3736;
  --accent:#5cc2b9; --accent-soft:#18302e; --ok:#7fd49a; --ok-soft:#173222; --warn:#f0c46a; --warn-soft:#3a2e12;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0f1515; --surface:#172020; --ink:#e3ecea; --muted:#94a5a3; --line:#2a3736;
  --accent:#5cc2b9; --accent-soft:#18302e; --ok:#7fd49a; --ok-soft:#173222; --warn:#f0c46a; --warn-soft:#3a2e12;
}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;padding-block:24px 48px}
main{max-width:820px;margin:0 auto;display:grid;gap:18px}
h1{font-size:24px;margin:0;font-weight:600}
.sub{color:var(--muted);margin:0}
#q{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
#q:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
ol{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row{display:grid;gap:4px;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px}
.ticket{font:500 12.5px var(--mono);color:var(--accent)}
time{color:var(--muted);font-family:var(--mono);margin-left:auto;font-variant-numeric:tabular-nums}
.status{padding:1px 8px;border-radius:99px;background:var(--line);color:var(--muted);font-weight:500}
.s-done{background:var(--ok-soft);color:var(--ok)}
.s-needs-review{background:var(--warn-soft);color:var(--warn)}
.s-in-progress{background:var(--accent-soft);color:var(--accent)}
.title{margin:0;font-weight:600}
.line{margin:0;color:var(--muted);max-width:70ch}
.links{margin:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px}
.links a{color:var(--accent);display:inline-flex;align-items:center;gap:5px}
.links .ico{width:14px;height:14px}
.links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* neoCRM brand band (NEO-91) — NeoSleep palette + mark until neoCRM has its own kit; dark in both themes */
.brand{--b-deep:#082A27;--b-teal:#128F83;--b-mint:#8ED6CE;position:relative;overflow:hidden;border-radius:16px;padding:22px 22px 20px;color:#eaf6f4;display:grid;gap:18px;
  background:radial-gradient(420px 220px at 105% -20%,rgba(142,214,206,.35),transparent 70%),radial-gradient(360px 240px at -10% 120%,rgba(18,143,131,.55),transparent 70%),linear-gradient(135deg,#0b3833 0%,var(--b-deep) 70%)}
.brand::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(142,214,206,.18);box-shadow:0 0 0 28px rgba(142,214,206,.05),0 0 0 56px rgba(142,214,206,.03);pointer-events:none}
.brand-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.lockup{display:flex;align-items:center;gap:12px}
.lockup svg{width:44px;height:auto;flex:none}
.wordmark{font:400 24px/1 var(--sans);letter-spacing:-.01em;color:#fff}
.wordmark b{font-weight:600;color:var(--b-mint)}
.tagline{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(234,246,244,.65);margin-top:5px}
.chip{font:500 13px var(--mono);letter-spacing:.04em;padding:5px 11px;border-radius:99px;background:rgba(142,214,206,.14);border:1px solid rgba(142,214,206,.35);color:var(--b-mint)}
.brand .links{position:relative;z-index:1}
.brand .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.22);color:#fff}
.brand .btn:hover{background:rgba(255,255,255,.12)}
.brand .btn.primary{background:var(--b-mint);border-color:var(--b-mint);color:var(--b-deep);font-weight:600}
.brand .btn.primary:hover{background:#a9e2db}
.brand .btn.ghost{color:rgba(234,246,244,.7);border-style:dashed;background:transparent}
.brand .btn:focus-visible{outline-color:var(--b-mint)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:500 12.5px var(--sans);padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.filters button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:480px){.wordmark{font-size:21px}.lockup svg{width:38px}.brand{padding:18px 16px}}
</style>
<main>
  <div class="brand">
    <div class="brand-top">
      <div class="lockup">
        <svg viewBox="0 0 309.33334 261.33334" aria-hidden="true"><g transform="translate(-170.07584,-250.27208)"><path fill="#8ED6CE" d="m 220.2689,438.2294 c -8.01562,-11.00914 -14.45034,-26.17365 -17.75105,-41.83334 l -1.1944,-5.66666 0.008,-13.33334 0.008,-13.33333 1.20667,-5.97581 c 2.84706,-14.0996 8.5524,-27.7383 16.75756,-40.05923 l 4.93839,-7.41551 6.49529,-6.83115 c 18.62809,-19.59131 40.08146,-31.24882 67.89156,-36.89147 l 7.36082,-1.4935 16.33333,0.0103 16.33333,0.0103 6,1.18691 c 18.95138,3.74892 34.4538,9.99444 48.92368,19.71006 l 4.92366,3.30594 -43.257,0.27506 -43.257,0.27505 -6.33334,1.16631 c -37.80399,6.96179 -66.19712,33.30083 -73.72712,68.39336 l -1.21592,5.66667 v 10 10 l 1.18835,5.53072 c 2.53224,11.78532 7.07478,22.20537 13.79974,31.65498 l 4.16493,5.85236 6.5786,6.3143 6.57861,6.31431 h -20.34608 -20.34608 z"/><path fill="#FFFFFF" d="m 309.65678,489.30318 c -0.91666,-0.13456 -3.91666,-0.56773 -6.66666,-0.96261 -19.56621,-2.80953 -39.87816,-11.23371 -56.00001,-23.22542 l -5,-3.71908 45.66667,-0.37774 45.66667,-0.37774 6.33333,-1.19037 c 13.59768,-2.55573 25.8585,-7.49295 36.95939,-14.88291 l 6.70728,-4.4651 6.37726,-6.35307 6.37726,-6.35308 4.41131,-6.66666 c 22.5994,-34.15371 17.09018,-78.2835 -13.26484,-106.25378 l -5.15089,-4.74623 h 18.41365 18.41365 l 2.3011,2.83334 c 8.98911,11.06829 17.10104,28.68565 20.59818,44.73482 l 1.47415,6.76518 -0.0144,13.33333 -0.0144,13.33334 -1.45977,6.76517 c -12.40255,57.47819 -74.07444,100.33033 -132.12899,91.80861 z"/></g></svg>
        <div><div class="wordmark">neo<b>CRM</b></div><div class="tagline">Change index</div></div>
      </div>
      <span class="chip" id="count">… changes</span>
    </div>
  </div>
  <header style="display:grid;gap:4px">
    <p class="sub">Newest first. One line per ticket: what changed, its status, and the Artifact / ticket / VS Code / PR links. Rows update live.</p>
  </header>
  <label for="q" class="sub">Filter</label>
  <input id="q" type="search" placeholder="Ticket, title or status">
  <div id="statuses" class="filters" role="group" aria-label="Status"></div>
  <ol id="list"><li class="row"><p class="line">Loading…</p></li></ol>
</main>
<script>
// CORE-105: rows live in this Artifact's database (collection "changes", one doc per
// ticket, written by ship-artifact via ArtifactData), so a ship never republishes the page.
const ICONS = {
  github: "M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12",
  linear: "M2.886 4.18A11.982 11.982 0 0 1 11.99 0C18.624 0 24 5.376 24 12.009c0 3.64-1.62 6.903-4.18 9.105L2.887 4.18ZM1.817 5.626l16.556 16.556c-.524.33-1.075.62-1.65.866L.951 7.277c.247-.575.537-1.126.866-1.65ZM.322 9.163l14.515 14.515c-.71.172-1.443.282-2.195.322L0 11.358a12 12 0 0 1 .322-2.195Zm-.17 4.862 9.823 9.824a12.02 12.02 0 0 1-9.824-9.824Z",
  board: "M3 3h5a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm6.5 0h5a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1ZM16 3h5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z",
  vscode: "M23.15 2.587L18.21.21a1.494 1.494 0 0 0-1.705.29l-9.46 8.63-4.12-3.128a.999.999 0 0 0-1.276.057L.327 7.261A1 1 0 0 0 .326 8.74L3.899 12 .326 15.26a1 1 0 0 0 .001 1.479L1.65 17.94a.999.999 0 0 0 1.276.057l4.12-3.128 9.46 8.63a1.492 1.492 0 0 0 1.704.29l4.942-2.377A1.5 1.5 0 0 0 24 20.06V3.939a1.5 1.5 0 0 0-.85-1.352zm-5.146 14.861L10.826 12l7.178-5.448v10.896z",
  artifact: "M4 2h11l5 5v15H4V2Zm10 1.5V8h4.5L14 3.5ZM7 12h10v1.6H7V12Zm0 4h10v1.6H7V16Z",
};
const SVG = "http://www.w3.org/2000/svg";
const list = document.getElementById("list");
const q = document.getElementById("q");
const statusBar = document.getElementById("statuses");
const count = document.getElementById("count");
let rows = [];
let status = "";

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const safeHref = (h) => typeof h === "string" && /^(https:|vscode:)/.test(h);
const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-");

function link(href, label, ico) {
  if (!safeHref(href)) return null;
  const a = el("a");
  a.href = href;
  a.rel = "noopener noreferrer";
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("class", "ico");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  const p = document.createElementNS(SVG, "path");
  p.setAttribute("fill", "currentColor");
  p.setAttribute("d", ICONS[ico]);
  svg.append(p);
  a.append(svg, label);
  return a;
}

function rowEl(r) {
  const li = el("li", "row");
  const head = el("div", "head");
  const time = el("time", null, String(r.updated ?? "").slice(0, 10));
  time.dateTime = r.updated ?? "";
  head.append(el("span", "ticket", r.ticket ?? r.branch ?? ""), el("span", "status s-" + slug(r.status ?? ""), r.status ?? ""), time);
  const links = el("p", "links");
  links.append(...[link(r.artifact, "Artifact", "artifact"), (r.linear && r.linear.includes("linear.app") ? link(r.linear, "Linear", "linear") : link(r.linear, "Board", "board")), link(r.vscode, "VS Code", "vscode"), link(r.pr, "PR", "github")].filter(Boolean));
  li.append(head, el("p", "title", r.title ?? ""), el("p", "line", r.headline ?? ""), links);
  return li;
}

function render() {
  const term = q.value.trim().toLowerCase();
  const shown = rows.filter((r) => (!status || r.status === status) && (!term || [r.ticket, r.title, r.headline, r.status, r.branch].join(" ").toLowerCase().includes(term)));
  count.textContent = `${rows.length} changes`;
  list.replaceChildren(...(shown.length ? shown.map(rowEl) : [el("li", "row", rows.length ? "No change matches." : "No changes shipped yet.")]));
  const counts = new Map();
  for (const r of rows) counts.set(r.status, (counts.get(r.status) ?? 0) + 1);
  const btn = (value, label) => {
    const b = el("button", null, label);
    b.type = "button";
    b.setAttribute("aria-pressed", String(status === value));
    b.addEventListener("click", () => { status = value; render(); });
    return b;
  };
  statusBar.replaceChildren(btn("", `All ${rows.length}`), ...[...counts].sort((a, b) => b[1] - a[1]).map(([s, n]) => btn(s, `${s} ${n}`)));
}

q.addEventListener("input", render);

(async () => {
  const db = await window.claude?.use?.("db");
  if (!db) {
    list.replaceChildren(el("li", "row", "Sign in to claude.ai to see the change index."));
    return;
  }
  db.collection("changes").orderBy("updated", "desc").limit(1000).onSnapshot(
    (snap) => { rows = snap.docs.map((d) => d.data()); render(); },
    () => list.replaceChildren(el("li", "row", "The change index could not be loaded. Reload the page."))
  );
})();
</script>
