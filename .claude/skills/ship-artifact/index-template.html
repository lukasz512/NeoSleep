<title>NeoSleep Change Index</title>
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f8f8; --surface:#ffffff; --ink:#15201f; --muted:#5a6968; --line:#d9e2e1;
  --accent:#0f6f6a; --accent-soft:#e2f1ef; --ok:#1d7a3e; --ok-soft:#e5f4ea; --warn:#8a5a00; --warn-soft:#fff3d6;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0f1515; --surface:#172020; --ink:#e3ecea; --muted:#94a5a3; --line:#2a3736;
  --accent:#5cc2b9; --accent-soft:#18302e; --ok:#7fd49a; --ok-soft:#173222; --warn:#f0c46a; --warn-soft:#3a2e12;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0f1515; --surface:#172020; --ink:#e3ecea; --muted:#94a5a3; --line:#2a3736;
  --accent:#5cc2b9; --accent-soft:#18302e; --ok:#7fd49a; --ok-soft:#173222; --warn:#f0c46a; --warn-soft:#3a2e12;
}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;padding-block:24px 48px}
main{max-width:820px;margin:0 auto;display:grid;gap:18px}
h1{font-size:24px;margin:0;font-weight:600}
.sub{color:var(--muted);margin:0}
#q{width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
#q:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
ol{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row{display:grid;gap:4px;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px}
.ticket{font:500 12.5px var(--mono);color:var(--accent)}
time{color:var(--muted);font-family:var(--mono);margin-left:auto;font-variant-numeric:tabular-nums}
.status{padding:1px 8px;border-radius:99px;background:var(--line);color:var(--muted);font-weight:500}
.s-done{background:var(--ok-soft);color:var(--ok)}
.s-needs-review{background:var(--warn-soft);color:var(--warn)}
.s-in-progress{background:var(--accent-soft);color:var(--accent)}
.title{margin:0;font-weight:600}
.line{margin:0;color:var(--muted);max-width:70ch}
.links{margin:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px}
.links a{color:var(--accent)}
.links a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<main>
  <header style="display:grid;gap:4px">
    <h1>NeoSleep Change Index</h1>
    <p class="sub">{{COUNT}} change(s), newest first. One line per ticket: what changed, its status when last shipped, and the Artifact / Linear / VS Code / PR links.</p>
  </header>
  <label for="q" class="sub">Filter</label>
  <input id="q" type="search" placeholder="Ticket, title or status">
  <ol id="list">
{{ROWS}}
  </ol>
</main>
<script>
const q = document.getElementById("q");
q.addEventListener("input", () => {
  const term = q.value.trim().toLowerCase();
  for (const li of document.querySelectorAll("#list .row")) li.hidden = term !== "" && !li.textContent.toLowerCase().includes(term);
});
</script>
