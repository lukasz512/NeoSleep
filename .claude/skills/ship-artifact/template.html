<title>{{TITLE}}</title>
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f8f8; --surface:#ffffff; --ink:#15201f; --muted:#5a6968; --line:#d9e2e1;
  --accent:#0f6f6a; --accent-soft:#e2f1ef; --deny:#b3261e; --deny-soft:#fbe9e7; --ok:#1d7a3e; --ok-soft:#e5f4ea; --warn:#8a5a00; --warn-soft:#fff3d6;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0f1515; --surface:#172020; --ink:#e3ecea; --muted:#94a5a3; --line:#2a3736;
  --accent:#5cc2b9; --accent-soft:#18302e; --deny:#f2968d; --deny-soft:#3a1f1c; --ok:#7fd49a; --ok-soft:#173222; --warn:#f0c46a; --warn-soft:#3a2e12;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0f1515; --surface:#172020; --ink:#e3ecea; --muted:#94a5a3; --line:#2a3736;
  --accent:#5cc2b9; --accent-soft:#18302e; --deny:#f2968d; --deny-soft:#3a1f1c; --ok:#7fd49a; --ok-soft:#173222; --warn:#f0c46a; --warn-soft:#3a2e12;
}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);padding-inline:16px;padding-block:24px 48px}
main{max-width:780px;margin:0 auto;display:grid;gap:28px}
h1{font-size:26px;line-height:1.25;margin:0;text-wrap:balance;font-weight:600}
h2{font-size:17px;margin:0 0 10px;font-weight:600}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:13px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:500;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{color:var(--muted);border-style:dashed}
.btn .ico{width:17px;height:17px;flex:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.summary{font-size:16px}
.decide{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.decide h2{color:var(--warn);margin:0}
.decide ol{margin:0;padding-left:20px;display:grid;gap:6px}
section{display:grid;gap:10px}
.matrix{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font:500 12px var(--mono);white-space:nowrap}
.allow{background:var(--ok-soft);color:var(--ok)}
.deny{background:var(--deny-soft);color:var(--deny)}
.hole{background:var(--deny);color:var(--surface)}
.neutral{background:var(--accent-soft);color:var(--accent)}
pre{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font:13px/1.55 var(--mono);white-space:pre}
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
figure{margin:0;display:grid;gap:6px}
figcaption{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
figure img{border:1px solid var(--line);border-radius:10px;max-width:100%;display:block}
.mockup{border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
ul.files{margin:8px 0 0;padding-left:18px}
ul.check{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.check li{display:grid;grid-template-columns:22px 1fr;gap:6px}
ul.check li::before{content:"☐";color:var(--accent)}
.muted{color:var(--muted)}
/* neoCRM brand band (NEO-91) — NeoSleep palette + mark until neoCRM has its own kit; dark in both themes */
.brand{--b-deep:#082A27;--b-teal:#128F83;--b-mint:#8ED6CE;position:relative;overflow:hidden;border-radius:16px;padding:22px 22px 20px;color:#eaf6f4;display:grid;gap:18px;
  background:radial-gradient(420px 220px at 105% -20%,rgba(142,214,206,.35),transparent 70%),radial-gradient(360px 240px at -10% 120%,rgba(18,143,131,.55),transparent 70%),linear-gradient(135deg,#0b3833 0%,var(--b-deep) 70%)}
.brand::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(142,214,206,.18);box-shadow:0 0 0 28px rgba(142,214,206,.05),0 0 0 56px rgba(142,214,206,.03);pointer-events:none}
.brand-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.lockup{display:flex;align-items:center;gap:12px}
.lockup svg{width:44px;height:auto;flex:none}
.wordmark{font:400 24px/1 var(--sans);letter-spacing:-.01em;color:#fff}
.wordmark b{font-weight:600;color:var(--b-mint)}
.tagline{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(234,246,244,.65);margin-top:5px}
.chip{font:500 13px var(--mono);letter-spacing:.04em;padding:5px 11px;border-radius:99px;background:rgba(142,214,206,.14);border:1px solid rgba(142,214,206,.35);color:var(--b-mint)}
.brand .links{position:relative;z-index:1}
.brand .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.22);color:#fff}
.brand .btn:hover{background:rgba(255,255,255,.12)}
.brand .btn.primary{background:var(--b-mint);border-color:var(--b-mint);color:var(--b-deep);font-weight:600}
.brand .btn.primary:hover{background:#a9e2db}
.brand .btn.ghost{color:rgba(234,246,244,.7);border-style:dashed;background:transparent}
.brand .btn:focus-visible{outline-color:var(--b-mint)}
@media (max-width:480px){.wordmark{font-size:21px}.lockup svg{width:38px}.brand{padding:18px 16px}}
</style>
<main>
  <div class="brand">
    <div class="brand-top">
      <div class="lockup">
        <svg viewBox="0 0 309.33334 261.33334" aria-hidden="true"><g transform="translate(-170.07584,-250.27208)"><path fill="#8ED6CE" d="m 220.2689,438.2294 c -8.01562,-11.00914 -14.45034,-26.17365 -17.75105,-41.83334 l -1.1944,-5.66666 0.008,-13.33334 0.008,-13.33333 1.20667,-5.97581 c 2.84706,-14.0996 8.5524,-27.7383 16.75756,-40.05923 l 4.93839,-7.41551 6.49529,-6.83115 c 18.62809,-19.59131 40.08146,-31.24882 67.89156,-36.89147 l 7.36082,-1.4935 16.33333,0.0103 16.33333,0.0103 6,1.18691 c 18.95138,3.74892 34.4538,9.99444 48.92368,19.71006 l 4.92366,3.30594 -43.257,0.27506 -43.257,0.27505 -6.33334,1.16631 c -37.80399,6.96179 -66.19712,33.30083 -73.72712,68.39336 l -1.21592,5.66667 v 10 10 l 1.18835,5.53072 c 2.53224,11.78532 7.07478,22.20537 13.79974,31.65498 l 4.16493,5.85236 6.5786,6.3143 6.57861,6.31431 h -20.34608 -20.34608 z"/><path fill="#FFFFFF" d="m 309.65678,489.30318 c -0.91666,-0.13456 -3.91666,-0.56773 -6.66666,-0.96261 -19.56621,-2.80953 -39.87816,-11.23371 -56.00001,-23.22542 l -5,-3.71908 45.66667,-0.37774 45.66667,-0.37774 6.33333,-1.19037 c 13.59768,-2.55573 25.8585,-7.49295 36.95939,-14.88291 l 6.70728,-4.4651 6.37726,-6.35307 6.37726,-6.35308 4.41131,-6.66666 c 22.5994,-34.15371 17.09018,-78.2835 -13.26484,-106.25378 l -5.15089,-4.74623 h 18.41365 18.41365 l 2.3011,2.83334 c 8.98911,11.06829 17.10104,28.68565 20.59818,44.73482 l 1.47415,6.76518 -0.0144,13.33333 -0.0144,13.33334 -1.45977,6.76517 c -12.40255,57.47819 -74.07444,100.33033 -132.12899,91.80861 z"/></g></svg>
        <div><div class="wordmark">neo<b>CRM</b></div><div class="tagline">Change report</div></div>
      </div>
      <span class="chip">{{TICKET}}</span>
    </div>
    <div class="links">{{LINKS}}</div>
  </div>
  <header style="display:grid;gap:12px">
    {{RESUME}}
    <span class="eyebrow">{{EYEBROW}}</span>
    <h1>{{HEADLINE}}</h1>
    <p class="summary">{{SUMMARY}}</p>
  </header>
  {{DECISIONS}}
  <section>
    <h2>What changed</h2>
    {{WHAT_CHANGED}}
  </section>
  <section>
    <h2>Run it locally</h2>
    <pre>{{RUN}}</pre>
    {{RUN_NOTE}}
  </section>
  <section>
    <h2>Verify it</h2>
    <ul class="check">{{VERIFY}}</ul>
    {{VERIFY_NOTE}}
  </section>
</main>
