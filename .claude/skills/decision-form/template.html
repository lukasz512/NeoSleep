<title>{{TITLE}}</title>
<base target="_blank">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f8f8; --surface:#ffffff; --ink:#15201f; --muted:#5a6968; --line:#d9e2e1;
  --accent:#0f6f6a; --accent-soft:#e2f1ef; --warn:#8a5a00; --warn-soft:#fff3d6; --ok:#1d7a3e; --ok-soft:#e5f4ea; --deny:#b3261e;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0f1515; --surface:#172020; --ink:#e3ecea; --muted:#94a5a3; --line:#2a3736;
  --accent:#5cc2b9; --accent-soft:#18302e; --warn:#f0c46a; --warn-soft:#3a2e12; --ok:#7fd49a; --ok-soft:#173222; --deny:#f2968d;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0f1515; --surface:#172020; --ink:#e3ecea; --muted:#94a5a3; --line:#2a3736;
  --accent:#5cc2b9; --accent-soft:#18302e; --warn:#f0c46a; --warn-soft:#3a2e12; --ok:#7fd49a; --ok-soft:#173222; --deny:#f2968d;
}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;padding-block:24px 0}
.defaults{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;font-size:14px}
.defaults h2{color:var(--ok)}
.defaults ul{margin:0;padding-left:18px;display:grid;gap:4px}
.defaults code{font:12.5px var(--mono);color:var(--muted)}
main{max-width:760px;margin:0 auto;display:grid;gap:28px;padding-bottom:48px}
h1{font-size:26px;line-height:1.25;margin:0;text-wrap:balance;font-weight:600}
h2{font-size:13px;margin:0;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.eyebrow{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.summary{font-size:16px}
.context{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--muted);font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font:500 14px var(--sans);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.opt input:focus-visible+span,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
{{WIDGET_CSS}}
</style>
<main>
  <header style="display:grid;gap:12px">
    <div class="eyebrow">{{EYEBROW}}</div>
    <h1>{{TITLE}}</h1>
    <p class="summary">{{SUMMARY}}</p>
    {{CONTEXT}}
    {{DEFAULTS}}
    <div class="links">{{LINKS}}</div>
  </header>
  {{WIDGET_HTML}}
</main>
{{WIDGET_SCRIPT}}
