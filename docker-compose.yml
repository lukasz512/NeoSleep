# Local PostgreSQL for development. See foundation/docs/LOCAL_DATABASE.md.
# Run: docker compose up -d
# Connect: postgresql://neosleep:neosleep_local@localhost:5432/neosleep
# Web UI: Adminer http://localhost:8080 | Directus http://localhost:8056 (see foundation/docs/DIRECTUS_AS_ADMIN.md)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neosleep
      POSTGRES_PASSWORD: neosleep_local
      POSTGRES_DB: neosleep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  directus:
    image: directus/directus:11
    ports:
      - "8056:8055"
    environment:
      # Override ADMIN_PASSWORD in .env or set here for dev. KEY/SECRET: keep or set in .env.
      KEY: "neosleep-dev-key-32chars-minimum!!"
      SECRET: "neosleep-dev-secret-32chars-minimum!!"
      ADMIN_EMAIL: "admin@neosleep.local"
      ADMIN_PASSWORD: "admin"
      DB_CLIENT: "pg"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "neosleep"
      DB_USER: "neosleep"
      DB_PASSWORD: "neosleep_local"
      WEBSOCKETS_ENABLED: "true"
      PUBLIC_URL: "http://localhost:8056"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
