# docker-compose.yml — LOCAL DEVELOPMENT
# Starts PostgreSQL + Adminer. BFF and Vue apps run separately via: pnpm start
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neosleep
      POSTGRES_PASSWORD: neosleep_local
      POSTGRES_DB: neosleep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neosleep"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
