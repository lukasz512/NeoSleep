# Deploy marketing website to GoDaddy FTP
# - main → neosleepcare.com (public_html/neosleepcare-site-prod/)
# - uat  → uat.neosleepcare.com (public_html/neosleepcare-site-uat/)

name: Deploy NeoSleepCare Site

on:
  push:
    branches: [main, uat]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm run build:website

      - name: Deploy to PROD (neosleepcare.com)
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/website/dist/
          server-dir: /public_html/neosleepcare-site-prod/
          dangerous-clean-slate: false

      - name: Deploy to UAT (uat.neosleepcare.com)
        if: github.ref == 'refs/heads/uat'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/website/dist/
          server-dir: /public_html/neosleepcare-site-uat/
          dangerous-clean-slate: false
