# Deploy marketing website to GoDaddy FTP
# - PROD → neosleepcare.com         (secret FTP_PATH_WEBSITE_PROD)
# - UAT  → uat.neosleepcare.com     (secret FTP_PATH_WEBSITE_UAT)
# - DEV  → dev.neosleepcare.com     (secret FTP_PATH_WEBSITE_DEV)

name: Deploy NeoSleepCare Site

on:
  push:
    branches: [PROD, uat, dev]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm run build:website

      - name: Deploy to PROD (neosleepcare.com)
        if: github.ref == 'refs/heads/PROD'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/website/dist/
          server-dir: ${{ secrets.FTP_PATH_WEBSITE_PROD }}/
          dangerous-clean-slate: false

      - name: Deploy to UAT (uat.neosleepcare.com)
        if: github.ref == 'refs/heads/uat'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/website/dist/
          server-dir: ${{ secrets.FTP_PATH_WEBSITE_UAT }}/
          dangerous-clean-slate: false

      - name: Deploy to DEV (dev.neosleepcare.com)
        if: github.ref == 'refs/heads/dev'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/website/dist/
          server-dir: ${{ secrets.FTP_PATH_WEBSITE_DEV }}/
          dangerous-clean-slate: false
