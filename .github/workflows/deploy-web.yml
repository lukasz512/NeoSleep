# Deploy marketing website to GoDaddy FTP
# - PROD → neosleepcare.com         (secret GODADY_FTP_WEB_PROD)
# - DEV  → dev.neosleepcare.com     (secret GODADY_FTP_WEB_DEV)
#
# NOTE: GODADY_FTP_WEB_* secrets must hold the FTP server-dir path (e.g.
# /public_html/neosleepcare.com/web/prod), not the public https:// URL —
# see secrets/deploy-notes.md for the exact paths.

name: Deploy NeoSleepCare Site

on:
  push:
    branches: [prod, dev]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm run build:web

      - name: Deploy to PROD (neosleepcare.com)
        if: github.ref == 'refs/heads/prod'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/web/dist/
          server-dir: ${{ secrets.GODADY_FTP_WEB_PROD }}/
          dangerous-clean-slate: false

      - name: Deploy to DEV (dev.neosleepcare.com)
        if: github.ref == 'refs/heads/dev'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/web/dist/
          server-dir: ${{ secrets.GODADY_FTP_WEB_DEV }}/
          dangerous-clean-slate: false
