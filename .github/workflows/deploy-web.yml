# Auto-deploy marketing website to DEV on every push to dev
# (dev.neosleepcare.com, path: secret GODADY_FTP_WEB_DEV). PROD is
# intentionally NOT deployed from here — prod is only ever updated manually
# via promote-web-dev-to-prod.yml ("Promote Web Dev → Prod" in Actions),
# which builds from dev and ships to GODADY_FTP_WEB_PROD. Don't re-add a
# push:[prod] trigger here without also removing the duplicate deploy logic
# from that file.
#
# NOTE: GODADY_FTP_WEB_DEV must hold the FTP server-dir path (e.g.
# /neosleepcare.com/web/dev), not the public https:// URL — see
# secrets/deploy-notes.md for the exact paths.

name: Deploy NeoSleepCare Site

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm run build:web

      - name: Deploy to DEV (dev.neosleepcare.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/web/dist/
          server-dir: ${{ secrets.GODADY_FTP_WEB_DEV }}/
          dangerous-clean-slate: false
