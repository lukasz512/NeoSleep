# Manual promotion: builds from the dev branch and ships BOTH the PWA and
# the website to PROD at once, running the two dedicated workflows in
# parallel (promote-pwa-dev-to-prod.yml / promote-web-dev-to-prod.yml).
#
# The API is deliberately left out: Render (neosleep-bff) auto-deploys on
# push to its tracked branch (see render.yaml) — there's no separate
# promote step for it here.

name: Promote ALL Dev → Prod

on:
  workflow_dispatch:

jobs:
  promote-pwa:
    uses: ./.github/workflows/promote-pwa-dev-to-prod.yml
    secrets: inherit

  promote-web:
    uses: ./.github/workflows/promote-web-dev-to-prod.yml
    secrets: inherit
