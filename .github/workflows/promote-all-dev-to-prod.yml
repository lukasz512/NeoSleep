# Ręczna promocja: buduje z gałęzi dev i wgrywa NA RAZ zarówno PWA jak i
# stronę WWW na PROD, uruchamiając oba dedykowane workflowy równolegle
# (promote-pwa-dev-to-prod.yml / promote-web-dev-to-prod.yml).
#
# API celowo pominięte: Render (neosleep-bff) sam auto-deployuje na push do
# śledzonego brancha (patrz render.yaml) — nie ma tu osobnego kroku promote.

name: Promote ALL Dev → Prod

on:
  workflow_dispatch:

jobs:
  promote-pwa:
    uses: ./.github/workflows/promote-pwa-dev-to-prod.yml
    secrets: inherit

  promote-web:
    uses: ./.github/workflows/promote-web-dev-to-prod.yml
    secrets: inherit
