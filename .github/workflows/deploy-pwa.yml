# Auto-deploy rep-app to DEV on every push to dev (pwa.dev.neosleepcare.com,
# path: secret GODADY_FTP_PWA_DEV). PROD is intentionally NOT deployed from
# here — prod is only ever updated manually via promote-pwa-dev-to-prod.yml
# ("Promote PWA Dev → Prod" in Actions), which builds from dev with PROD env
# vars and ships to GODADY_FTP_PWA_PROD. Don't re-add a push:[prod] trigger
# here without also removing the duplicate deploy logic from that file.
#
# NOTE: GODADY_FTP_PWA_DEV must hold the FTP server-dir path (e.g.
# /neosleepcare.com/pwa/dev), not the public https:// URL — see
# secrets/deploy-notes.md for the exact paths.
#
# TODO: migrate to SSH (appleboy/scp-action) once Hetzner VPS is provisioned.
# See infrastructure/setup/provision.md for the migration runbook.

name: Deploy NeoSleepCare App

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set API URL for build
        run: |
          echo "VITE_API_URL=${{ secrets.RENDER_API_URL_DEV }}" >> $GITHUB_ENV
          echo "VITE_GA_ID=${{ secrets.VITE_GA_ID_DEV }}" >> $GITHUB_ENV

      - name: Build rep-app
        run: pnpm run build:pwa

      - name: Deploy to DEV (pwa.dev.neosleepcare.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/pwa/dist/
          server-dir: ${{ secrets.GODADY_FTP_PWA_DEV }}/
          dangerous-clean-slate: false
