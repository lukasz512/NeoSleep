# Deploy rep-app to GoDaddy FTP
# - prod → app.neosleepcare.com (path: secret FTP_PATH_APP_PROD)
# - dev  → app-dev.neosleepcare.com (path: secret FTP_PATH_APP_DEV)
#
# TODO: migrate to SSH (appleboy/scp-action) once Hetzner VPS is provisioned.
# See infrastructure/setup/provision.md for the migration runbook.

name: Deploy NeoSleepCare App

on:
  push:
    branches: [prod, dev]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set API URL for build
        run: |
          if [ "${{ github.ref }}" = "refs/heads/prod" ]; then
            echo "VITE_API_URL=${{ secrets.RENDER_API_URL_PROD }}" >> $GITHUB_ENV
            echo "VITE_GA_ID=${{ secrets.VITE_GA_ID_PROD }}" >> $GITHUB_ENV
          else
            echo "VITE_API_URL=${{ secrets.RENDER_API_URL_DEV }}" >> $GITHUB_ENV
            echo "VITE_GA_ID=${{ secrets.VITE_GA_ID_DEV }}" >> $GITHUB_ENV
          fi

      - name: Build rep-app
        run: pnpm run build:pwa

      - name: Deploy to PROD (app.neosleepcare.com)
        if: github.ref == 'refs/heads/prod'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/pwa/dist/
          server-dir: ${{ secrets.FTP_PATH_APP_PROD }}/
          dangerous-clean-slate: false

      - name: Deploy to DEV (app-dev.neosleepcare.com)
        if: github.ref == 'refs/heads/dev'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/pwa/dist/
          server-dir: ${{ secrets.FTP_PATH_APP_DEV }}/
          dangerous-clean-slate: false
