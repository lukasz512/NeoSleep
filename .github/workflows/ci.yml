# Runs on every pull request: lint + typecheck across all workspaces, plus
# test suites. apps/api needs a real Postgres for its integration tests (see
# CLAUDE.md: "No mock-only tests for the API server") — a fresh postgres:15 service
# container is migrated before tests run, kept separate from the shared
# Supabase dev/prod DB.
#
# What a run tests depends on the event (CORE-152, infrastructure/scripts/ci-scope.mjs):
# work branches run only the e2e specs a change can break, on Chromium; dev/prod pushes
# run everything on Chromium + WebKit; the nightly run adds Firefox; the dev→prod
# promote PR copies the result of the dev run of the same commit.

name: CI

on:
  pull_request:
  push:
    # Work branches too (NEO-182): the session waits for a green CI before it
    # hands over the "Create PR" link, so CI has to run before a PR exists.
    # Keep in sync with .claude/ci-autofix.json "ciBranchPatterns".
    branches: [dev, prod, "worktree-*", "worker/*", "claude/*"]
  # Nightly full run incl. Firefox (CORE-152 D1). 08:00 UTC = 02:00 in Mexico City.
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read # ci-mirror-run.mjs reads the dev run of the promote PR's commit

# One run per commit (CORE-98). Work branches are already tested by their push
# run, so their pull_request twin skips its jobs (see JOB_IF below) instead of
# racing the push run — a cancelled twin showed as a red "test" on the PR.
# The group is per event + branch: a newer push cancels only an older push of
# the same branch, never the run GitHub shows on the PR.
# dev and prod never cancel a run in progress (CORE-152 D2): during a burst of merges
# one run finishes and only the newest waiting one follows, so dev always ends up with
# a complete result instead of a chain of cancelled runs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/prod' }}

jobs:
  test:
    # JOB_IF (CORE-98): pull_request runs only for heads the push trigger doesn't cover
    # (e.g. renovate/*); a skipped job counts as passed for required checks. Head dev =
    # the dev→prod promote PR: it runs, but only to copy the dev run's result (Scope step).
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'worktree-') || startsWith(github.head_ref, 'worker/') || startsWith(github.head_ref, 'claude/'))
    runs-on: ubuntu-latest
    # CORE-151: a hung e2e used to hold the job (and the session waiting on it) for up
    # to an hour; the default limit is 6 h. A full 3-engine run takes ~20-30 min.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DEFAULT_TENANT_SLUG: neosleep
      # auth-session-cookie.spec.ts forces NODE_ENV=production to test the
      # cross-site cookie config — env.ts throws if SESSION_SECRET is unset
      # in that branch. Fixed test-only value, not a real secret.
      SESSION_SECRET: ci-test-session-secret-not-for-production-use
      # orthoapnea-order.spec.ts / routes/partners/orthoapnea-treatments.spec.ts
      # mock the OrthoApnea HTTP boundary (fetch) entirely — never a real
      # request — but still need these non-empty so services/partners/
      # orthoapnea.ts's login() doesn't short-circuit with "not configured".
      # Setting this at the job level (not apps/api/vitest.config.ts's own
      # `test.env`) because that alone was confirmed NOT to reach these
      # values in CI (still failed with them unset) even though it worked
      # identically locally — kept vitest.config.ts's copy too as a working
      # default for local runs, but this is the one CI actually depends on.
      ORTHOAPNEA_EMAIL: qa-orthoapnea@neosleepcare.com
      ORTHOAPNEA_PASSWORD: test-only-not-a-real-credential

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ci-scope.mjs diffs a work branch against origin/dev

      # CORE-152: what this run tests and why (printed in the log).
      - name: Scope
        id: scope
        run: node infrastructure/scripts/ci-scope.mjs

      - name: Promote PR — copy the dev run of this commit
        if: steps.scope.outputs.mirror == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: node infrastructure/scripts/ci-mirror-run.mjs

      - name: Setup pnpm
        if: steps.scope.outputs.run_app == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.scope.outputs.run_app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm install --frozen-lockfile

      # @neo/email and @neo/documents are real compiled packages (dist/ is
      # gitignored, apps/api is plain Node without a bundler so it needs the
      # built .js/.d.ts, not raw .ts) — without this, `pnpm -r typecheck`/
      # `pnpm -r lint` hit apps/api before either package has ever been
      # built and fail with "Cannot find module '@neo/email'" (or
      # '@neo/documents'). See infrastructure/scripts/start.sh step 4 for
      # the same requirement in local dev.
      - name: Build @neo/email
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm --filter @neo/email build

      - name: Build @neo/documents
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm --filter @neo/documents build

      - name: Build @neo/device-order
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm --filter @neo/device-order build

      - name: Lint (all workspaces)
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm -r lint

      - name: i18n key parity (en/pl/mx)
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm i18n:parity

      - name: Typecheck (all workspaces)
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm -r typecheck

      - name: Run DB migrations
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm --filter @neo/api migrate

      # Regression guard for the exact drift 027_sync_create_tenant_schema.sql
      # fixed: create_tenant_schema() had gone stale relative to later
      # migrations for years (see that migration's header) — this fails fast
      # if a future migration touches a tenant table without also updating
      # the function, instead of drifting silently again.
      - name: Check create_tenant_schema() parity
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm --filter @neo/api check-tenant-schema-parity

      # Integration tests must never write into "neosleep" (see
      # apps/api/vitest.config.ts) — they target an isolated "test" schema
      # instead. Still cloned via sync-test-schema.ts rather than calling
      # create_tenant_schema('test') directly, even though that function is
      # accurate again as of 027 — keeps the isolated test schema on its own
      # independent path from the function the parity check above validates.
      - name: Sync isolated test tenant schema
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm --filter @neo/api sync-test-schema

      - name: Test — infrastructure scripts (blocking)
        if: steps.scope.outputs.run_app == 'true'
        run: node --test "infrastructure/scripts/*.test.mjs"

      - name: Video titles have no punctuation (blocking)
        if: steps.scope.outputs.run_app == 'true'
        run: node infrastructure/scripts/check-video-titles.mjs

      - name: Test — api (blocking)
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm --filter @neo/api test

      - name: Test — ui package (blocking)
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm --filter @neo/ui test

      - name: Test — AJM corporativo client site (blocking)
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm --filter @ajm/corporativo test

      - name: Test — pwa (blocking)
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm --filter @neo/pwa test

      - name: Test — web (blocking)
        if: steps.scope.outputs.run_app == 'true'
        run: pnpm --filter @neo/web test

      # apps/pwa/e2e/ (Playwright, ADR-020) — real browser engines only for the
      # auth behaviors jsdom/Postgres-integration tests genuinely can't cover
      # (reload/JS-realm teardown, bfcache, multi-context storage). New,
      # scoped coverage — blocking from day one, not inheriting the informational
      # status of the legacy `pnpm --filter @neo/pwa test` step above.
      - name: Install Playwright browsers
        if: steps.scope.outputs.run_app == 'true'
        env:
          E2E_BROWSERS: ${{ steps.scope.outputs.browsers }}
        run: pnpm --filter @neo/pwa exec playwright install --with-deps $E2E_BROWSERS

      # apps/api's dev script (which Playwright's webServer starts) reads
      # ../../.env via tsx --env-file — that file doesn't exist in CI (the
      # job's `env:` block sets real env vars instead), so write one from
      # those same already-known values.
      - name: Write .env for E2E dev servers
        if: steps.scope.outputs.run_app == 'true'
        run: |
          cat > .env <<EOF
          DATABASE_URL=${DATABASE_URL}
          DEFAULT_TENANT_SLUG=${DEFAULT_TENANT_SLUG}
          SESSION_SECRET=${SESSION_SECRET}
          EOF

      - name: Test — pwa e2e (blocking)
        if: steps.scope.outputs.run_app == 'true'
        timeout-minutes: 25
        env:
          E2E_BROWSERS: ${{ steps.scope.outputs.browsers }}
          E2E_SPECS: ${{ steps.scope.outputs.e2e_specs }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report.json
        run: |
          echo "e2e browsers: $E2E_BROWSERS · specs: ${E2E_SPECS:-all}"
          pnpm --filter @neo/pwa test:e2e --reporter=github,json $(for b in $E2E_BROWSERS; do printf -- '--project=%s ' "$b"; done) $E2E_SPECS

      # A test that passed only on its retry is green but unreliable — say so (CORE-152).
      - name: Flaky e2e tests
        if: always() && steps.scope.outputs.run_app == 'true'
        run: node infrastructure/scripts/e2e-flaky.mjs apps/pwa/e2e-report.json

      # Page snapshot + trace of each failing e2e test — the log alone only
      # says "element not found", not what the page showed instead.
      - name: Upload e2e failure traces
        if: failure() && steps.scope.outputs.run_app == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pwa-e2e-test-results
          path: apps/pwa/test-results/
          retention-days: 7

  # The API ships as a Docker image to Cloud Run (NEO-45, deploy-api.yml). Build it on
  # every PR/push so a broken Dockerfile fails here, not during a deploy. Build only,
  # nothing is pushed.
  api-image:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'worktree-') || startsWith(github.head_ref, 'worker/') || startsWith(github.head_ref, 'claude/') || github.head_ref == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --platform linux/amd64 -f apps/api/Dockerfile -t neo-api:ci .
      # Render a real PDF inside the built image, with a Google Font like every document
      # template: that HTTPS fetch loads Chromium's network stack (NSS + libsqlite3). A plain
      # page renders even when those system libs are missing, so it must be this page.
      - name: Render a PDF inside the image
        run: |
          docker run --rm -w /app/apps/api --entrypoint node neo-api:ci --input-type=module -e '
            const r = await import("/app/apps/api/dist/services/documentRenderer.js");
            const html = "<!doctype html><html><head><meta charset=UTF-8><link href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap\" rel=stylesheet><style>body{font-family:Poppins,sans-serif}</style></head><body><h1>CI smoke é ñ ł</h1></body></html>";
            const pdf = await r.renderHtmlToPdf(html);
            if (Buffer.from(pdf.subarray(0, 5)).toString("latin1") !== "%PDF-") throw new Error("not a PDF");
            console.log("PDF OK", pdf.length, "bytes");
            process.exit(0);'

  # Claude Code tooling (hooks, ship-artifact, worktree cleanup) has its own self-tests.
  # They need only git, jq, bash and Node, no install and no database (CORE-23).
  tooling:
    if: github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'worktree-') || startsWith(github.head_ref, 'worker/') || startsWith(github.head_ref, 'claude/') || github.head_ref == 'dev')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Tooling self-tests
        run: |
          git config --global user.name ci && git config --global user.email ci@example.com
          node --test .claude/skills/ship-artifact/ticket.test.mjs
          bash .claude/hooks/pre-tool-linear-ticket-format.test.sh
          bash infrastructure/scripts/worktree-clean.test.sh
          bash infrastructure/scripts/test-db.test.sh
