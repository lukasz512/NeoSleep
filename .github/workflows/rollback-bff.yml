# Manual BFF rollback — restarts the previous PM2 build stored as a backup.
# Run this when a deploy breaks production and you need an immediate fix.
#
# How it works:
#   Before each deploy, deploy-bff.yml should cp the current dist/ to dist-backup/.
#   This workflow swaps dist/ with dist-backup/ and restarts PM2.
#
# TODO: add backup step to deploy-bff.yml once the pattern is validated.

name: Rollback BFF

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to roll back"
        required: true
        type: choice
        options: [prod, uat, dev]
      reason:
        description: "Reason for rollback (for audit log)"
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Rollback PROD
        if: inputs.environment == 'prod'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Rollback triggered: ${{ inputs.reason }}"
            cd /home/deploy/apps/bff-prod
            if [ ! -d dist-backup ]; then
              echo "ERROR: No backup found at dist-backup/" && exit 1
            fi
            mv dist dist-broken-$(date +%Y%m%d%H%M%S)
            cp -r dist-backup dist
            pm2 restart bff-prod
            echo "Rollback complete. Verify: pm2 logs bff-prod"

      - name: Rollback UAT
        if: inputs.environment == 'uat'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Rollback triggered: ${{ inputs.reason }}"
            cd /home/deploy/apps/bff-uat
            if [ ! -d dist-backup ]; then
              echo "ERROR: No backup found at dist-backup/" && exit 1
            fi
            mv dist dist-broken-$(date +%Y%m%d%H%M%S)
            cp -r dist-backup dist
            pm2 restart bff-uat
            echo "Rollback complete."

      - name: Rollback DEV
        if: inputs.environment == 'dev'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Rollback triggered: ${{ inputs.reason }}"
            cd /home/deploy/apps/bff-dev
            if [ ! -d dist-backup ]; then
              echo "ERROR: No backup found at dist-backup/" && exit 1
            fi
            mv dist dist-broken-$(date +%Y%m%d%H%M%S)
            cp -r dist-backup dist
            pm2 restart bff-dev
            echo "Rollback complete."
