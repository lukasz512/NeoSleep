# Stopgap for NEO-45 (apps/api feels slow on Render's free plan).
# Render's free plan spins a service down after ~15 min with no HTTP traffic,
# then pays a cold-start cost (container boot) on the next request. This job
# pings /health every 10 minutes so the service never goes idle long enough
# to spin down.
#
# This does NOT fix CPU throttling under real load if that turns out to be
# the actual cause of the slowness (Render free plan also has a small shared
# CPU allocation) — see docs/stories/api-hosting-migration-render-to-railway.md
# for the paid-migration path if this stopgap isn't enough.
#
# Remove this workflow once apps/api is off Render's free plan.

name: Keep API warm (Render free-tier stopgap)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [prod, dev]
    steps:
      - name: Ping health endpoint
        env:
          API_URL: ${{ matrix.target == 'prod' && secrets.RENDER_API_URL_PROD || secrets.RENDER_API_URL_DEV }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "No URL configured for ${{ matrix.target }}, skipping."
            exit 0
          fi
          curl -sf -o /dev/null -w "${{ matrix.target }}: HTTP %{http_code} in %{time_total}s\n" "$API_URL/health"
