# Security baseline (CORE-180). The repo is public, so this is free:
#   gitleaks — every commit a PR or push adds; the full history weekly.
#              Reviewed false positives live in .gitleaksignore.
#   CodeQL   — static analysis of the JS/TS code; results in the Security tab.
# Secret scanning, push protection and Dependabot alerts are repo settings,
# not this file.
name: Security

on:
  pull_request:
  push:
    branches: [dev, prod]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # PR: only the commits the PR adds. Push: the pushed range.
      # Schedule/manual: the whole history.
      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "Scanning full history"
            gitleaks detect --source . --redact --verbose
          else
            echo "Scanning $BASE_SHA..$HEAD_SHA"
            gitleaks detect --source . --redact --verbose --log-opts="$BASE_SHA..$HEAD_SHA"
          fi

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
