# Security scan — runs on push to main branches and weekly on schedule.
# Checks for known vulnerabilities in dependencies (npm audit) across all workspaces.

name: Security Scan

on:
  push:
    branches: [prod, uat, dev]
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit (all workspaces)
        # Fails on high or critical severity vulnerabilities
        run: pnpm audit --audit-level=high
        continue-on-error: false

  typecheck:
    name: TypeScript strict check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck BFF
        run: pnpm --filter @neo/api typecheck

      - name: Typecheck app
        run: pnpm --filter @neo/app typecheck
