# Ręczna promocja: zbuduj z gałęzi uat i wgraj na PROD (app.neosleepcare.com).
# W Actions wybierz workflow "Promote App UAT → Prod" i kliknij "Run workflow".

name: Promote App UAT → Prod

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (uat)
        uses: actions/checkout@v4
        with:
          ref: uat

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rep-app
        run: pnpm run build:rep-app

      - name: Deploy to PROD (app.neosleepcare.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/rep-app/dist/
          server-dir: ${{ secrets.FTP_PATH_APP_PROD }}/
          dangerous-clean-slate: false
