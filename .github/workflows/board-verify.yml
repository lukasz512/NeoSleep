# Work board verify stage (CORE-277) — a Needs Review ticket whose code reached dev moves to
# Verifying; this workflow runs the checks and posts the result, which returns the ticket to
# Needs Review marked pass (ready to close) or fail (a fix ticket is created in Approved).
#
# Runs after the git-state report on dev (the report is what queues tickets), on demand
# (the board's re-run button queues the ticket; run this workflow to pick it up) and daily.
#
# Secrets: BOARD_API_URL + BOARD_AGENT_TOKEN (same as board-git-state.yml).

name: Work board verify

on:
  workflow_run:
    workflows: ["Work board git state"]
    types: [completed]
    branches: [dev]
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: board-verify
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The default branch (dev) carries the code under test.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check pending tickets and report
        run: node infrastructure/scripts/board-verify.mjs --run-url "$RUN_URL"
        env:
          BOARD_API_URL: ${{ secrets.BOARD_API_URL }}
          BOARD_AGENT_TOKEN: ${{ secrets.BOARD_AGENT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
