# Deploy BFF (Express) to Hetzner VPS via SSH
# Triggers only when services/api/** changes on PROD, uat, or dev branches.
# - PROD → PM2 process "bff-prod" (port 3000)
# - UAT  → PM2 process "bff-uat"  (port 3001)
# - DEV  → PM2 process "bff-dev"  (port 3002)

name: Deploy BFF

on:
  push:
    branches: [prod, uat, dev]
    paths:
      - "services/api/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build BFF
        run: pnpm --filter @neo/api build

      - name: Upload BFF build to VPS (PROD)
        if: github.ref == 'refs/heads/prod'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "services/api/dist/,services/api/package.json"
          target: "/home/deploy/apps/bff-prod/"
          strip_components: 2

      - name: Restart PM2 (PROD)
        if: github.ref == 'refs/heads/prod'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/deploy/apps/bff-prod
            pnpm install --prod --frozen-lockfile
            pm2 restart bff-prod

      - name: Upload BFF build to VPS (UAT)
        if: github.ref == 'refs/heads/uat'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "services/api/dist/,services/api/package.json"
          target: "/home/deploy/apps/bff-uat/"
          strip_components: 2

      - name: Restart PM2 (UAT)
        if: github.ref == 'refs/heads/uat'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/deploy/apps/bff-uat
            pnpm install --prod --frozen-lockfile
            pm2 restart bff-uat

      - name: Upload BFF build to VPS (DEV)
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "services/api/dist/,services/api/package.json"
          target: "/home/deploy/apps/bff-dev/"
          strip_components: 2

      - name: Restart PM2 (DEV)
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/deploy/apps/bff-dev
            pnpm install --prod --frozen-lockfile
            pm2 restart bff-dev
