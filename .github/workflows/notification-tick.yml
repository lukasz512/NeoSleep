# Notification clock (CORE-3, ADR-027): every 5 minutes, per tenant, escalate
# notifications unread past their escalateAfterMin to email, dispatch due
# pending deliveries to the channel adapters (push CORE-5, email CORE-6; until
# they exist those rows just stay pending), and purge by retention window.
# Overlap-safe (FOR UPDATE SKIP LOCKED) and idempotent, so a late or doubled run
# is harmless. Same secrets as appointment-reminders.yml (API_URL_DEV,
# API_URL_PROD, INTERNAL_JOB_SECRET); without them the job only warns.

name: Notification tick (every 5 min)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: notification-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
    steps:
      - name: Run notification tick
        env:
          TARGET: ${{ matrix.target }}
          API_URL_DEV: ${{ secrets.API_URL_DEV }}
          API_URL_PROD: ${{ secrets.API_URL_PROD }}
          JOB_SECRET: ${{ secrets.INTERNAL_JOB_SECRET }}
        run: |
          if [ "$TARGET" = "prod" ]; then API_URL="$API_URL_PROD"; else API_URL="$API_URL_DEV"; fi
          if [ -z "$API_URL" ]; then
            echo "::warning::$TARGET API URL not set, skipped."
            exit 0
          fi
          if [ -z "$JOB_SECRET" ]; then
            echo "::warning::INTERNAL_JOB_SECRET not set in GitHub secrets, skipped."
            exit 0
          fi
          status=$(curl -s -o result.json -w "%{http_code}" --max-time 120 -X POST \
            -H "Authorization: Bearer $JOB_SECRET" -H "Content-Type: application/json" -d '{}' \
            "$API_URL/api/v1/internal/jobs/notifications/tick")
          echo "$TARGET: HTTP $status"
          if [ "$status" = "404" ]; then
            echo "::warning::$TARGET has no notification tick endpoint yet (404), skipped until it is deployed."
            exit 0
          fi
          jq '.' result.json || cat result.json
          [ "$status" = "200" ] || exit 1
          [ "$(jq '.tenantsFailed' result.json)" = "0" ]
