# Manual promotion: build from the dev branch, deploy to PROD (neosleepcare.com),
# then fast-forward the `prod` branch to match `dev` so the git branch never
# drifts from what's actually live. In Actions, select the "Promote Web Dev →
# Prod" workflow and click "Run workflow".
#
# The prod push needs write access to a ruleset-protected branch — see the
# bypass note on the "Fast-forward prod branch to dev" step below.

name: Promote Web Dev → Prod

on:
  workflow_dispatch:
  workflow_call:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (dev)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm run build:web

      - name: Deploy to PROD (neosleepcare.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/web/dist/
          server-dir: ${{ secrets.GODADY_FTP_WEB_PROD }}/
          dangerous-clean-slate: false

      # Runs last, after a successful deploy, so `prod` only ever moves once
      # what it points to is actually live. Fast-forward only — dev must
      # always be ahead of or equal to prod, never behind.
      #
      # Requires the `prod` ruleset to let this job's actor through: either
      # add "GitHub Actions" (or this workflow) to the ruleset's bypass list,
      # or make sure "Include administrators" is off and check out with a
      # PAT (secrets.PROD_PUSH_TOKEN) belonging to a bypass-listed admin
      # instead of the default GITHUB_TOKEN.
      - name: Fast-forward prod branch to dev
        run: git push origin HEAD:refs/heads/prod
