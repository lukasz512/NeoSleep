# Ręczna promocja: zbuduj z gałęzi dev i wgraj na PROD (neosleepcare.com).
# W Actions wybierz workflow "Promote Web Dev → Prod" i kliknij "Run workflow".

name: Promote Web Dev → Prod

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (dev)
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm run build:web

      - name: Deploy to PROD (neosleepcare.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/web/dist/
          server-dir: ${{ secrets.GODADY_FTP_WEB_PROD }}/
          dangerous-clean-slate: false
