# Ręczna promocja: zbuduj z gałęzi dev i wgraj na PROD (pwa.neosleepcare.com).
# W Actions wybierz workflow "Promote PWA Dev → Prod" i kliknij "Run workflow".
#
# TODO: migrate to SSH (appleboy/scp-action) once Hetzner VPS is provisioned.
# See infrastructure/setup/provision.md for the migration runbook.

name: Promote PWA Dev → Prod

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (dev)
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set API URL for build
        run: |
          echo "VITE_API_URL=${{ secrets.RENDER_API_URL_PROD }}" >> $GITHUB_ENV
          echo "VITE_GA_ID=${{ secrets.VITE_GA_ID_PROD }}" >> $GITHUB_ENV

      - name: Build app
        run: pnpm run build:pwa

      - name: Deploy to PROD (pwa.neosleepcare.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/pwa/dist/
          server-dir: ${{ secrets.GODADY_FTP_PWA_PROD }}/
          dangerous-clean-slate: false
