# Deploy rep-app to GoDaddy FTP
# - PROD → app.neosleepcare.com (path: secret FTP_PATH_APP_PROD)
# - uat  → app-uat.neosleepcare.com (path: secret FTP_PATH_APP_UAT)
#
# TODO: migrate to SSH (appleboy/scp-action) once Hetzner VPS is provisioned.
# See infra/setup/provision.md for the migration runbook.

name: Deploy NeoSleepCare App

on:
  push:
    branches: [PROD, uat]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set API URL for build
        run: |
          if [ "${{ github.ref }}" = "refs/heads/PROD" ]; then
            echo "VITE_API_URL=${{ secrets.VITE_API_URL_PROD }}" >> $GITHUB_ENV
            echo "VITE_GA_ID=${{ secrets.VITE_GA_ID_PROD }}" >> $GITHUB_ENV
          else
            echo "VITE_API_URL=${{ secrets.VITE_API_URL_UAT }}" >> $GITHUB_ENV
            echo "VITE_GA_ID=${{ secrets.VITE_GA_ID_UAT }}" >> $GITHUB_ENV
          fi

      - name: Build rep-app
        run: pnpm run build:app

      - name: Deploy to PROD (app.neosleepcare.com)
        if: github.ref == 'refs/heads/PROD'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/app/dist/
          server-dir: ${{ secrets.FTP_PATH_APP_PROD }}/
          dangerous-clean-slate: false

      - name: Deploy to UAT (app-uat.neosleepcare.com)
        if: github.ref == 'refs/heads/uat'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/app/dist/
          server-dir: ${{ secrets.FTP_PATH_APP_UAT }}/
          dangerous-clean-slate: false
