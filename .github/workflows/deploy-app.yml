# Deploy rep-app to GoDaddy FTP
# - PROD → app.neosleepcare.com (public_html/neosleepcare-app-prod/)
# - uat  → app-uat.neosleepcare.com (public_html/neosleepcare-app-uat/)

name: Deploy NeoSleepCare App

on:
  push:
    branches: [PROD, uat]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build rep-app
        run: pnpm run build:rep-app

      - name: Deploy to PROD (app.neosleepcare.com)
        if: github.ref == 'refs/heads/PROD'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/rep-app/dist/
          server-dir: /public_html/neosleepcare-app-prod/
          dangerous-clean-slate: false

      - name: Deploy to UAT (app-uat.neosleepcare.com)
        if: github.ref == 'refs/heads/uat'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./apps/rep-app/dist/
          server-dir: /public_html/neosleepcare-app-uat/
          dangerous-clean-slate: false
