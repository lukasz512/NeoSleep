# Daily device-order reconciliation (NEO-218): asks each API to compare the
# orders it sent to the lab with the orders the lab lists, store the run, and
# email the admins when something needs a look (a clean run sends nothing).
# The result is on the admin dashboard ("Device orders vs. the lab").
#
# 13:00 UTC = 07:00 in Mexico City (no daylight saving since 2022).
#
# Secrets: API_URL_DEV / API_URL_PROD (Cloud Run; prod is skipped while unset), and
# RECONCILIATION_JOB_SECRET — this job's own secret (Łukasz D2), the same value
# as the APIs' RECONCILIATION_JOB_SECRET in Secret Manager (one GCP project
# serves both Cloud Run services; infrastructure/cloud-run/secrets.list).
# Prod answers 404 until the reconciliation is promoted there: that is a
# warning, not a failure. Dev must answer 200.

name: Device order reconciliation (daily)

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
    steps:
      - name: Run the reconciliation
        env:
          TARGET: ${{ matrix.target }}
          API_URL_DEV: ${{ secrets.API_URL_DEV }}
          API_URL_PROD: ${{ secrets.API_URL_PROD }}
          JOB_SECRET: ${{ secrets.RECONCILIATION_JOB_SECRET }}
        run: |
          # Chosen here, not with `&&/||` in the expression: an empty prod URL must
          # never fall through to dev's. Prod is the Cloud Run API only (CORE-66);
          # the old Render service has no RECONCILIATION_JOB_SECRET and answers 401.
          if [ "$TARGET" = "prod" ]; then API_URL="$API_URL_PROD"; else API_URL="$API_URL_DEV"; fi
          if [ "$TARGET" = "prod" ] && [ -z "$API_URL" ]; then
            echo "::warning::API_URL_PROD not set (prod still on Render, CORE-66) — skipped."
            exit 0
          fi
          if [ -z "$API_URL" ] || [ -z "$JOB_SECRET" ]; then
            echo "::error::$TARGET API URL or RECONCILIATION_JOB_SECRET not set."
            exit 1
          fi
          status=$(curl -s -o result.json -w "%{http_code}" --max-time 300 -X POST \
            -H "Authorization: Bearer $JOB_SECRET" -H "Content-Type: application/json" -d '{}' \
            "$API_URL/api/v1/device-orders/jobs/reconcile")
          echo "$TARGET: HTTP $status"
          if [ "$TARGET" = "prod" ] && [ "$status" = "404" ]; then
            echo "::warning::prod has no reconciliation yet (404) — skipped until it is promoted."
            exit 0
          fi
          jq '{tenantsFailed, tenants}' result.json || cat result.json
          [ "$status" = "200" ] || exit 1
          # A tenant whose run itself crashed is a failure of the job, not a finding.
          [ "$(jq '.tenantsFailed' result.json)" = "0" ]
