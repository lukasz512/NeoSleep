# Nginx config for app-uat.neosleepcare.com (UAT)
# Serves Vue SPA from /home/deploy/apps/app-uat/
# Proxies /api /auth /health to BFF on port 3001
#
# After certbot runs, it will add the SSL server block automatically.
# Run: certbot --nginx -d app-uat.neosleepcare.com

server {
    listen 80;
    server_name app-uat.neosleepcare.com;

    root /home/deploy/apps/app-uat;
    index index.html;

    # Vue SPA — serve static files, fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to BFF (UAT: port 3001)
    location ~ ^/(api|auth|health)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass_header Set-Cookie;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
