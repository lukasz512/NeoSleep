# Nginx config for app.neosleepcare.com (PROD)
# Serves Vue SPA from /home/deploy/apps/app-prod/
# Proxies /api /auth /health to BFF on port 3000
#
# After certbot runs, it will add the SSL server block automatically.
# Run: certbot --nginx -d app.neosleepcare.com

server {
    listen 80;
    server_name app.neosleepcare.com;

    root /home/deploy/apps/app-prod;
    index index.html;

    # Vue SPA — serve static files, fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to BFF (PROD: port 3000)
    location ~ ^/(api|auth|health)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Pass cookies through without stripping Secure flag
        # (nginx handles TLS termination, BFF sees X-Forwarded-Proto=https)
        proxy_pass_header Set-Cookie;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
